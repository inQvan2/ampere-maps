# Builds the Ampere APKs (one per processor) from the private inQvan2/ampere repo and publishes them as a release.
# Started by the "Release APK" workflow in ampere when a v* tag is pushed, or by hand with the tag or branch to build.
#
# Secrets:
#   AMPERE_READ_TOKEN          fine-grained token with "Contents: read" on inQvan2/ampere
#   ANDROID_KEYSTORE_BASE64    release keystore (.jks) in base64
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
name: Build APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch of inQvan2/ampere to build (a vX.Y.Z tag publishes a release)
        required: true
      publish:
        description: Publish the APKs as a release (off to only build them)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: apk-${{ inputs.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ampere
        uses: actions/checkout@v4
        with:
          repository: inQvan2/ampere
          ref: ${{ inputs.ref }}
          token: ${{ secrets.AMPERE_READ_TOKEN }}
          path: ampere

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Write the signing key
        working-directory: ampere/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > key.properties

      - name: Build
        working-directory: ampere
        env:
          REF: ${{ inputs.ref }}
        run: |
          # The version name comes from a vX.Y.Z tag, else from pubspec.yaml; the run number keeps versionCode growing
          # so every build installs over the previous one (Flutter adds a per-processor offset on top).
          name=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]] && name="${REF#v}"
          echo "VERSION=$name" >> "$GITHUB_ENV"
          flutter pub get
          flutter build apk --release --split-per-abi --build-name="$name" --build-number="${{ github.run_number }}"
          mkdir -p "$GITHUB_WORKSPACE/out"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "$GITHUB_WORKSPACE/out/ampere-$name-$abi.apk"
          done
          cd "$GITHUB_WORKSPACE/out" && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          ls -l >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the APKs as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ampere-${{ env.VERSION }}
          path: out/

      - name: Publish release
        if: inputs.publish && startsWith(inputs.ref, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="app-v$VERSION"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          gh release create "$tag" out/*.apk out/SHA256SUMS --repo "$GITHUB_REPOSITORY" --latest=false \
            --title "Ampere $VERSION" \
            --notes "$(printf '%s\n' \
              "Instala el APK de tu procesador:" \
              "" \
              "- **ampere-$VERSION-arm64-v8a.apk**: casi todos los móviles actuales (64 bits). Si dudas, es este." \
              "- **ampere-$VERSION-armeabi-v7a.apk**: móviles antiguos de 32 bits." \
              "- **ampere-$VERSION-x86_64.apk**: emuladores y algunas tabletas." \
              "" \
              "Si instalas el que no corresponde, Android lo rechaza.")"

      # After the release, so apk.json never points to files that are not there yet (same as cuba.json).
      - name: Point apk.json to the new APKs
        if: inputs.publish && startsWith(inputs.ref, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" BUILD="${{ github.run_number }}" \
            python3 - <<'PY'
          import json, os, pathlib
          v = os.environ["VERSION"]
          apks = [{"abi": f.name[len(f"ampere-{v}-"):-len(".apk")], "url": f"{os.environ['BASE']}/{f.name}",
                   "size": f.stat().st_size} for f in sorted(pathlib.Path("out").glob("*.apk"))]
          json.dump({"tag": os.environ["TAG"], "version": v, "build": int(os.environ["BUILD"]), "apks": apks},
                    open("apk.json", "w"))
          PY
          cat apk.json >> "$GITHUB_STEP_SUMMARY"
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/apk.json" --jq .sha 2>/dev/null) || sha=""
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/apk.json" \
            -f message="chore: point apk.json to $TAG" \
            -f content="$(base64 -w0 apk.json)" \
            ${sha:+-f sha="$sha"}
