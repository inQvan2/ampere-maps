# Builds cuba.pmtiles (OpenMapTiles schema, z0-14 by default) with Planetiler and publishes it as a release asset.
name: Build Cuba map

on:
  workflow_dispatch:
    inputs:
      args:
        description: Extra Planetiler arguments, e.g. --exclude-layers=housenumber
        default: ''
      publish:
        description: Publish the file as a release (off to only measure its size)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build cuba.pmtiles
        env:
          ARGS: ${{ inputs.args }}
        run: |
          curl -fsSL -o planetiler.jar https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar
          # --download fetches the Geofabrik extract plus the world water polygons and Natural Earth.
          java -Xmx4g -jar planetiler.jar --download --area=cuba --output=cuba.pmtiles $ARGS
          ls -l cuba.pmtiles
          echo "cuba.pmtiles: $(stat -c %s cuba.pmtiles) bytes ($ARGS)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="cuba-$(date -u +%Y-%m-%d)"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          gh release create "$tag" cuba.pmtiles --repo "$GITHUB_REPOSITORY" \
            --title "Mapa de Cuba $(date -u +%Y-%m-%d)" \
            --notes "Mapa vectorial de Cuba (esquema OpenMapTiles, zoom 0-14) generado con Planetiler a partir de OpenStreetMap. © OpenStreetMap contributors (ODbL)."

      # After the release, so cuba.json never points to a file that is not there yet. The app reads it from
      # raw.githubusercontent.com, which has no per-IP limit like the GitHub API (60 an hour, shared behind NAT).
      - name: Point cuba.json to the new map
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$TAG"
          jq -n --arg tag "$tag" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/cuba.pmtiles" \
            --argjson size "$(stat -c %s cuba.pmtiles)" \
            '{tag: $tag, url: $url, size: $size}' > cuba.json
          cat cuba.json >> "$GITHUB_STEP_SUMMARY"
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/cuba.json" --jq .sha 2>/dev/null) || sha=""
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/cuba.json" \
            -f message="chore: point cuba.json to $tag" \
            -f content="$(base64 -w0 cuba.json)" \
            ${sha:+-f sha="$sha"}
